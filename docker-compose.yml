services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: venture
      POSTGRES_PASSWORD: venture
      POSTGRES_DB: venturegenesis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venture"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://venture:venture@postgres:5432/venturegenesis
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      VG_DATA_DIR: /data
      VG_MODELS_DIR: /models
    volumes:
      - ./data:/data:ro      # real YC/Failory training data
      - ./models:/models     # trained model bundles (created on first run)
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "[ -f /models/failure_model.joblib ] || python -m app.ml_training.train;
             python seed.py || true;
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
